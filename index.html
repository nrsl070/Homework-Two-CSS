<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Styled Page</title>
  <!-- Подключаем CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Skip to Main Content -->
  <a href="#main-content">Skip to Main Content</a>

  <!-- Header -->
  <header>
    <h1>My First Styled Page</h1>
  </header>

  <!-- Navigation -->
  <nav>
    <ul>
      <li>Home</li>
      <li>About</li>
      <li>Contact</li>
    </ul>
    <!-- Логотип (декоративный) -->
    <img src="logo.png" alt="">
  </nav>

  <!-- Main Content -->
  <main id="main-content">
    <p>Welcome to my first styled webpage! This is a paragraph to demonstrate CSS styling.</p>

    <!-- Grid Section -->
    <div class="grid">
      <img src="image1.jpg" alt="Beautiful landscape">
      <img src="image2.jpg" alt="City skyline at sunset">
    </div>

    <!-- Flex Section -->
    <div class="flex">
      <p>Item 1</p>
      <p>Item 2</p>
      <p>Item 3</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>Copyright © 2026</p>
  </footer>

  <!-- Optional JS -->
  <script src="script.js"></script>
</body>

</html>
